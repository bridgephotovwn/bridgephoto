name: bridgephoto
description: "BRIDGE PHOTO - a free document scanner. No ads, no account, no tracking."
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.4
  share_plus: ^11.0.0
  file_picker: ^10.0.0
  pdf: ^3.11.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  # Writes the zip that a .docx or .xlsx actually is. Already in the tree
  # as a dependency of `pdf`; pure Dart, no size cost.
  archive: ^4.0.0
  # Only for the transform matrix used to rotate the PDF stamp. Already
  # in the tree as a dependency of `pdf`; pure Dart, no size cost.
  vector_math: ^2.2.0
  # The four-shot capture, which needs the torch held on and the frames taken
  # in one go. ML Kit's scanner owns its own camera screen and gives us no way
  # to do either. This brings android.permission.CAMERA with it and nothing
  # else — the no-internet promise is untouched, and the release build still
  # refuses to finish if INTERNET ever appears.
  camera: ^0.11.0
  # Tells us the phone is being held FLAT. Sliding a level phone sideways moves
  # the picture by a pure translation, which is exactly what the frame aligner
  # can undo; tilting it does not, and no amount of aligning will fix that.
  sensors_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/NotoSansDevanagari-Regular.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
