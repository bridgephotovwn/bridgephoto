org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler fails on the Flutter plugin modules with this
# toolchain: every compile ends in "Could not close incremental caches ...
# Storage is already registered", so a release build cannot finish. The modules
# are a few files each, so compiling them whole costs almost nothing. Remove
# this line once a newer Kotlin/AGP fixes it - the symptom is obvious.
kotlin.incremental=false
