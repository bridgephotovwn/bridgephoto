<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-label="BRIDGE PHOTO – PDF Scanner">
  <title>BRIDGE PHOTO – PDF Scanner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B4F4A"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#F59E0B"/>
      <stop offset="0.88" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="910" cy="70" r="190" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="110" cy="480" r="150" fill="#ffffff" fill-opacity="0.04"/>

  <!-- document sheet: 220 x 290, folded corner, at (150,105) -->
  <g transform="translate(150 105)">
    <rect x="9" y="11" width="220" height="290" rx="14" fill="#000000" fill-opacity="0.25"/>
    <path d="M14 0 H166 L220 54 V276 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14 V14 a14 14 0 0 1 14 -14 Z" fill="#ffffff"/>
    <path d="M166 0 V40 a14 14 0 0 0 14 14 H220 Z" fill="#CCFBF1"/>
    <g fill="#CBD5E1">
      <rect x="34" y="78" width="118" height="12" rx="6"/>
      <rect x="34" y="106" width="152" height="9" rx="4.5"/>
      <rect x="34" y="128" width="152" height="9" rx="4.5"/>
      <rect x="34" y="150" width="120" height="9" rx="4.5"/>
      <rect x="34" y="184" width="152" height="9" rx="4.5"/>
      <rect x="34" y="206" width="152" height="9" rx="4.5"/>
      <rect x="34" y="228" width="96" height="9" rx="4.5"/>
    </g>
    <!-- the scan line as a single bridge arch: soft glow, then the arch -->
    <path d="M-16 196 Q110 92 236 196" fill="none" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="22" stroke-linecap="round"/>
    <path d="M-16 196 Q110 92 236 196" fill="none" stroke="url(#arch)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="655" y="240" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="2">BRIDGE PHOTO</text>
  <text x="655" y="296" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#99F6E4" letter-spacing="5">PDF SCANNER</text>
</svg>
